<title>놀며 배우는 AI 탐구 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모눈 실험노트 위에 커리큘럼 지도(첫 화면) → 차시별 상세 페이지(해시 라우팅). 차시마다 크레파스 색 하나. */
:root{
  --paper:#F3F6FA; --panel:#FFFFFF; --ink:#1E2940; --muted:#5A6680; --line:#D6DFEA; --grid:#E4EBF3;
  --accent:#2F6FEB;
  --c1:#2E9E5B; --c2:#2F6FEB; --c3:#EE7F1B; --c4:#D9A400; --c5:#8B5CF6; --c6:#E0453A;
  --t1:#E3F4EA; --t2:#E4EDFD; --t3:#FDEEDF; --t4:#FBF2D2; --t5:#EFE9FE; --t6:#FCE6E4;
  --sea:#BFE3F2; --sand:#F6E7BF;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --panel:#1A2336; --ink:#E8EDF6; --muted:#9BA7BF; --line:#2D3953; --grid:#18213A;
  --accent:#7AA2FF;
  --c1:#4CC27F; --c2:#6E9BFF; --c3:#FF9E4A; --c4:#F2C230; --c5:#A98BFF; --c6:#FF6B5E;
  --t1:#16301F; --t2:#18264A; --t3:#3A2614; --t4:#352C0C; --t5:#271F45; --t6:#3A1A18;
  --sea:#1C3B4B; --sand:#3B331C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --panel:#1A2336; --ink:#E8EDF6; --muted:#9BA7BF; --line:#2D3953; --grid:#18213A;
  --accent:#7AA2FF;
  --c1:#4CC27F; --c2:#6E9BFF; --c3:#FF9E4A; --c4:#F2C230; --c5:#A98BFF; --c6:#FF6B5E;
  --t1:#16301F; --t2:#18264A; --t3:#3A2614; --t4:#352C0C; --t5:#271F45; --t6:#3A1A18;
  --sea:#1C3B4B; --sand:#3B331C; color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(2rem,5vw,3rem)}
h2{font-size:1.6rem}
h3{font-size:1.25rem}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.15rem;color:var(--ink);text-decoration:none;margin-right:auto}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-family:var(--display);text-decoration:none;color:var(--ink);padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.95rem}
.nav a[aria-current="page"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.nav a:focus-visible,.cur a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.chip{display:inline-block;font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--tc);color:var(--cc)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* home hero */
.hero{display:grid;gap:14px;padding-block:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.95rem}
.facts b{color:var(--ink)}

/* curriculum map */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.flow span{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--tc);color:var(--cc);font-weight:700}
.flow i{font-style:normal;color:var(--muted)}
.cur{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.cur a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s,box-shadow .15s;min-width:0}
.cur a:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.cur .chead{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--tc)}
.cur .num{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--cc);min-width:1.4em;text-align:center}
.cur .ttl{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.cur .area{margin-left:auto;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--cc);white-space:nowrap}
.cur dl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;margin:0;padding:14px 16px 16px;font-size:.95rem;align-items:baseline}
.cur dt{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.cur dd{margin:0;min-width:0}
.cur dd.learn{color:var(--cc);font-weight:700}
.cur .go{margin-top:auto;padding:0 16px 14px;font-size:.82rem;color:var(--muted)}
@media (max-width:900px){.cur a{grid-template-columns:56px 1fr 1fr}.cur .prn{grid-column:2/-1;text-align:left}}
@media (max-width:640px){.cur a{grid-template-columns:52px 1fr}.cur .per,.cur .prn{grid-column:1/-1;text-align:left}}

/* session page */
.shead{display:grid;gap:10px;border-left:8px solid var(--cc);padding-left:18px}
.shead .n{font-family:var(--display);color:var(--cc);font-size:1.1rem}
.goal{display:flex;gap:10px;flex-wrap:wrap}
.period{display:grid;gap:14px}
.period header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.period header .tag{font-family:var(--display);background:var(--cc);color:var(--panel);padding:2px 12px;border-radius:8px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps>li{display:grid;grid-template-columns:58px minmax(0,1fr) 46px;gap:12px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}
.steps>li:first-child{border-top:0}
.steps ul li{display:list-item;padding:2px 0;border:0}
.steps .st{font-weight:700;font-size:.85rem;color:var(--cc);padding-top:2px}
.steps .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:right;padding-top:2px}
.steps ul{margin:4px 0 0;padding-left:18px}
.timebar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.timebar span{background:var(--cc)}
.timebar span:nth-child(2){opacity:.6}
.timebar span:nth-child(3){opacity:.3}
.tablet{background:var(--tc);border-radius:10px;padding:12px 14px;font-size:.92rem}
.tablet b{color:var(--cc)}

/* slides strip */
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.slide{min-height:96px;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:.78rem;line-height:1.35}
.slide .sn{font-family:var(--display);color:var(--cc);font-size:.9rem}
.slide b{font-size:.84rem}

/* make items */
.make{display:grid;gap:14px}
.mk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.mk{grid-template-columns:1fr}}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:0}
.spec dt{color:var(--muted);font-weight:700}
.spec dd{margin:0}
.stars{color:var(--cc);letter-spacing:2px}
.howto{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;overflow:hidden}
.fig svg{max-width:100%;height:auto}
.fig figcaption{font-size:.82rem;color:var(--muted);margin-top:8px}
figure{margin:0}
svg text{font-family:var(--body)}
.ink{fill:var(--ink)} .mutedf{fill:var(--muted)} .panelf{fill:var(--panel)} .linef{stroke:var(--line)}

/* command cards */
.cards{display:flex;flex-wrap:wrap;gap:10px}
.ccard{width:118px;height:76px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;color:#fff;font-weight:700;font-size:.85rem;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.ccard svg{width:34px;height:34px}
.ccard.back{background:var(--panel);color:var(--ink);border:2px dashed var(--line);box-shadow:none}
.ccard .cnt{font-size:.7rem;font-weight:500;opacity:.9}
.bug{width:150px;min-height:92px;border-radius:9px;border:2px solid var(--c6);background:var(--t6);padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:4px}
.bug b{font-family:var(--display);color:var(--c6);font-weight:400}

/* picture cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pc{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px;font-size:.8rem}
.pc .e{font-size:2rem;line-height:1.2;display:block}

/* pixel */
.px{display:grid;grid-template-columns:repeat(8,minmax(0,26px));gap:0;border:2px solid var(--ink);width:max-content;max-width:100%}
.px div{aspect-ratio:1;min-width:0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-variant-numeric:tabular-nums;background:var(--panel)}
.pxrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,58px));border:3px solid var(--ink);border-radius:8px;overflow:hidden;width:100%;max-width:354px;background:var(--sea)}
.board div{aspect-ratio:1;min-width:0;overflow:hidden;border:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.62rem;line-height:1.1;background:var(--sand);color:var(--ink);text-align:center}
.board div .e{font-size:1.4rem}
.board div.W{background:var(--sea)}

/* mock sheets */
.sheet{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:14px;box-shadow:0 2px 0 var(--line)}
.passport{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));width:100%;max-width:520px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.passport>div{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.passport>div+div{border-left:2px dashed var(--line);border-top:2px dashed var(--line);margin:-2px 0 0 -2px}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stamps span{border:2px dashed var(--line);border-radius:50%;aspect-ratio:1;width:100%;max-width:76px;justify-self:center;padding:4px;overflow:hidden;word-break:keep-all;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.68rem;text-align:center;color:var(--muted);line-height:1.2}

/* tables */
.tbl{min-width:0}
table{border-collapse:collapse;width:100%;font-size:.92rem;word-break:keep-all;overflow-wrap:anywhere}
@media (max-width:560px){th,td{padding:7px 6px;font-size:.84rem}}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:.82rem;color:var(--muted);letter-spacing:.03em}
td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check li{display:flex;gap:8px}
.check li::before{content:"";flex:0 0 16px;height:16px;border:2px solid var(--cc,var(--accent));border-radius:4px;margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{font-family:var(--display);text-decoration:none;border:1.5px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;color:var(--ink)}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* blocks, sequences, signs, bins */
.blks{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start}
.blkwrap{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.blkwrap svg{max-width:100%;height:auto}
.blkwrap .cnt{font-size:.75rem;color:var(--muted)}
.seq{display:grid;gap:6px;max-width:360px}
.seq div{display:flex;gap:10px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-left:10px solid var(--sc);border-radius:6px;padding:6px 10px;font-size:.9rem}
.seq b{font-family:var(--display);color:var(--sc);font-weight:400}
.sign{width:130px;aspect-ratio:1/1.414;background:var(--panel);border:3px solid var(--sc);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:1.3rem;color:var(--sc)}
.sign span{font-size:3.4rem;line-height:1}
.bins3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.bins3>div{border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.bins3 b{font-family:var(--display);font-size:1.2rem;font-weight:400}
.bins4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.bins4>div{border:2px solid var(--sc);border-top:14px solid var(--sc);border-radius:6px 6px 14px 14px;background:var(--panel);padding:8px;display:grid;gap:4px;font-size:.82rem}
.bins4 b{font-family:var(--display);font-weight:400;font-size:1rem}
.bins4 span{background:var(--paper);border-radius:4px;padding:2px 6px}
.bugs{display:grid;gap:10px}
.bugrow b{font-size:.85rem}
.bugrow>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.bugrow span{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.8rem}
.bugrow span.wrong{border-color:var(--c6);border-width:2.5px}
.bugrow i{font-style:normal;color:var(--muted)}
.bugcard{width:130px;border:2px solid var(--c6);background:var(--t6);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;font-size:.78rem}
.bugcard b{font-family:var(--display);font-weight:400;color:var(--c6);font-size:1.1rem}
a.ext{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
a.ext::after{content:" 열기 ↗";font-size:.75em;font-weight:700;text-decoration:none;display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:var(--t2);color:var(--accent)}
a.ext:hover{background:var(--t2)}
.story{background:var(--tc);border-radius:12px;padding:12px 16px;max-width:70ch;font-size:.98rem}
.story b{font-family:var(--display);font-weight:400;color:var(--cc);margin-right:6px}
.extra h3{font-size:1.1rem}
.learn{display:grid;gap:6px;align-content:start;border-top:3px solid var(--line);padding-top:10px}
.board div.R{background:var(--line)}
@media (prefers-reduced-motion:reduce){.cur a{transition:none}}
</style>

<div class="top"><div class="wrap">
  <a class="brand" href="#home">놀며 배우는 AI 탐구 실험실</a>
  <nav class="nav" id="nav"></nav>
</div></div>
<main class="wrap" id="app"></main>

<script>
const S = [
 {id:1, color:1, title:"로봇에게 말하는 법", sub:"샌드위치 로봇과 보물 찾기",
  goal:"컴퓨터와 로봇은 정해 준 순서(알고리즘)대로만 움직인다는 것을 놀이로 알고, AI가 내 그림을 알아보는 모습을 태블릿으로 체험한다.",
  principle:"순서(알고리즘) · 패턴 알아보기",
  p1:{kind:"언플러그드", name:"샌드위치 로봇 + 순서 카드 퀴즈", steps:[
    ["도입",7,"「AI 탐험가 여권」 받고 이름 쓰기",["발표자료 사진 퀴즈: 우리 주변 AI 찾기 (AI 스피커, 로봇청소기 등 6장 + AI가 아닌 선풍기·손전등 2장)"]],
    ["전개",28,"선생님은 샌드위치 로봇!",["교사가 로봇이 되어 학생들이 말하는 대로만 종이 샌드위치를 만들어요. \"빵을 놓아요\"라고 하면 빵을 바닥에 놓는 식으로 말 그대로 움직여서 웃음이 터져요","\"어떻게 말해야 로봇이 알아들을까?\" → 한 단계씩, 정확한 순서로 말하기","모둠 순서 카드 퀴즈: 색 띠 카드 6장(샌드위치 만들기 단계)을 섞어 두고, 순서대로 놓은 모둠이 손 들기"]],
    ["정리",5,"순서가 바뀌면 어떻게 될까?",["카드 두 장을 바꿔 놓고 로봇 선생님이 그대로 해 보기","여권에 1번 도장"]]]},
  p2:{kind:"언플러그드 + 태블릿", name:"사람 로봇 보물 찾기 → Quick, Draw!", url:"quickdraw.withgoogle.com", steps:[
    ["사람 로봇",15,"블록 카드로 친구 로봇 움직이기",["교실 뒤 빈 공간, 의자 위 인형이 보물. 명령자가 블록 카드(앞으로 1칸=한 걸음, 오른쪽으로 90° 돌기 등)를 한 장씩 읽으면 로봇 친구가 그대로 움직여요","'시작하기'로 출발, 보물에 닿으면 '도착!' 외치기. 모둠마다 한 판씩"]],

function treeSVG(){

  const leaf=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="18">${t}</text>`;
  const ln=(x1,y1,x2,y2,l)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="2"/><text x="${(x1+x2)/2+(x2>x1?8:-8)}" y="${(y1+y2)/2}" font-size="11" text-anchor="${x2>x1?"start":"end"}" class="mutedf">${l}</text>`;
  return `<svg viewBox="0 0 560 230" width="560" style="max-width:100%">
  ${box(210,8,140,"살아 있어요?","var(--c2)")}
  ${ln(250,42,130,80,"예")}${ln(310,42,430,80,"아니오")}
  ${box(50,80,160,"하늘을 날아요?","var(--c2)")}${box(350,80,160,"하늘을 날아요?","var(--c2)")}
  ${ln(100,114,70,150,"예")}${ln(160,114,190,150,"아니오")}
  ${ln(400,114,370,150,"예")}${ln(460,114,490,150,"아니오")}
  ${leaf(70,178,"🦋🦅")}${leaf(70,202,"🐦🦆")}
  ${leaf(190,178,"🐶🐱🐟")}${leaf(190,202,"🐙🐢🐧")}
  ${leaf(370,178,"✈️🚁")}${leaf(490,178,"🚗🚌🚢")}${leaf(490,202,"🚲🚂🛶")}
  </svg><figcaption>질문 하나로 카드가 반씩 줄어들어요. AI도 이렇게 질문을 이어 가며 답을 찾아요.</figcaption>`}
